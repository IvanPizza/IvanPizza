<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IvanPizza</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #ff914d; --red: #e63946; --dark: #1a1a1a; --gray: #f4f4f4; --tg: #0088cc; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--gray); color: #333; padding-bottom: 180px; -webkit-tap-highlight-color: transparent; }
        header { background: var(--dark); color: white; text-align: center; padding: 30px 15px; border-bottom: 5px solid var(--accent); }
        .logo-circle { width: 80px; height: 80px; background: white; border-radius: 50%; margin: 0 auto 12px; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; }
        h1 span { color: var(--accent); }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .label { font-weight: 900; text-transform: uppercase; font-size: 0.9rem; margin: 25px 0 15px; display: flex; align-items: center; }
        .label::before { content: ''; width: 4px; height: 18px; background: var(--accent); margin-right: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item { background: white; padding: 12px; border-radius: 15px; border: 1px solid #ddd; cursor: pointer; transition: 0.1s; position: relative; }
        .item.active { border-color: var(--accent); background: #fffcf9; }
        .counter { display: flex; align-items: center; justify-content: space-between; background: #f0f0f0; border-radius: 8px; padding: 3px; margin-top: 10px; }
        .btn-c { width: 32px; height: 32px; border: none; background: white; border-radius: 6px; font-weight: 900; cursor: pointer; }
        .info-block { background: var(--dark); color: white; padding: 40px 20px; text-align: left; margin-top: 30px; border-radius: 20px 20px 0 0; }
        footer { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px 20px 25px; box-sizing: border-box; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); z-index: 1000; border-radius: 25px 25px 0 0; text-align: center; }
        .total { font-size: 1.5rem; font-weight: 900; margin-bottom: 12px; color: var(--red); }
        .btn-ord { width: 100%; padding: 16px; border-radius: 12px; color: white; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; background: var(--tg); font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <div class="logo-circle"><img src="logo.jpg"></div>
    <h1>Ivan<span>Pizza</span></h1>
    <p style="font-size: 0.85rem; opacity: 0.9; margin: 10px 0 0;">Собери свою идеальную пиццу!</p>
</header>

<div class="container">
    <div class="label">🍕 Конструктор (Основа 999₽)</div>
    <div id="tops-grid" class="grid"></div>
</div>

<div class="info-block">
    <b style="color:var(--accent); text-transform:uppercase;">ИНФОРМАЦИЯ</b>
    <p style="font-size:0.85rem; line-height:1.6; opacity:0.8; margin-top: 10px;">
        1. Выберите от 3-х добавок.<br>
        2. Нажмите кнопку заказа.<br>
        3. В чате нажмите "ОТПРАВИТЬ".<br><br>
        Самовывоз: ул. Спортивная д. 1 п.2.
    </p>
</div>

<footer>
    <div class="total">ИТОГО: <span id="total-val">0</span>₽</div>
    <button onclick="makeOrder()" class="btn-ord">Оформить заказ</button>
</footer>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const TOPS = [
        {n: "Пепперони", e: "🥓"}, {n: "Салями", e: "🍖"}, {n: "Ветчина", e: "🥩"}, 
        {n: "Бекон", e: "🥓"}, {n: "Курица", e: "🍗"}, {n: "Индейка", e: "🦃"}, 
        {n: "Пармезан", e: "🧀"}, {n: "Чеддер", e: "🧀"}, {n: "Российский сыр", e: "🧀"},
        {n: "Помидор", e: "🍅"}, {n: "Черри", e: "🍅"}, {n: "Оливки", e: "🫒"}, 
        {n: "Маслины", e: "🌑"}, {n: "Халапеньо", e: "🌶️"}, {n: "Грибы", e: "🍄"}, 
        {n: "Красный лук", e: "🧅"}, {n: "Лук фри", e: "🧅"}, {n: "Болгарский перец", e: "🫑"}, 
        {n: "Огурчики", e: "🥒"}, {n: "Сырный соус", e: "🍶"}
    ];

    let cart = {};

    function render() {
        const grid = document.getElementById('tops-grid');
        grid.innerHTML = TOPS.map((obj, i) => {
            const q = cart[i] || 0;
            return `
            <div class="item ${q > 0 ? 'active' : ''}" onclick="upd(${i}, 1)">
                <span style="font-weight:700; font-size:0.8rem; display:block;">${obj.e} ${obj.n}</span>
                <span style="color:var(--accent); font-weight:900;">100₽</span>
                ${q > 0 ? `
                <div class="counter">
                    <button class="btn-c" onclick="event.stopPropagation(); upd(${i}, -1)">-</button>
                    <b>${q}</b>
                    <button class="btn-c" onclick="event.stopPropagation(); upd(${i}, 1)">+</button>
                </div>` : ''}
            </div>`;
        }).join('');
        
        updateTotal();
    }

    function upd(i, d) {
        cart[i] = Math.max(0, (cart[i] || 0) + d);
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        render();
    }

    function updateTotal() {
        let total = 0, count = 0;
        for(let i in cart) { if(cart[i] > 0) { total += cart[i] * 100; count += cart[i]; } }
        if(count > 0) total += 999;
        document.getElementById('total-val').innerText = total;
        return { total, count };
    }

    function makeOrder() {
        const data = updateTotal();
        if(data.count < 3) { tg.showAlert("Выберите минимум 3 наполнителя!"); return; }

        let itemsText = "";
        for(let i in cart) {
            if(cart[i] > 0) itemsText += `▪️ ${TOPS[i].n} x${cart[i]}\n`;
        }

        const message = `🍕 *НОВЫЙ ЗАКАЗ*\n\n${itemsText}\n💰 *ИТОГО: ${data.total}₽*`;
        
        // 1. Пытаемся отправить данные боту (если открыто через бота)
        tg.sendData(message);

        // 2. Прямой переход в ваш профиль с текстом
        const username = "IvanPizzaPrigorodLesnoe";
        const url = `https://t.me/${username}?text=${encodeURIComponent(message)}`;
        
        tg.openTelegramLink(url);
    }

    render();
</script>
</body>
</html>
